services:
  - type: web
    name: skill-viva-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: MONGODB_URI
        sync: false
      - key: SARVAM_API_KEY_LLM
        sync: false
      - key: SARVAM_API_KEY_TTS
        sync: false
      - key: SARVAM_API_KEY_STT
        sync: false
